    <script>
        const API_URLS = [
            "/compilar",
            "http://127.0.0.1:8000/compilar",
            "http://127.0.0.1:8001/compilar",
        ];

        const TIPOS_INGREDIENTES = {
            harina: "solido",
            sal: "solido",
            agua: "liquido",
            leche: "liquido",
        };

        const $ = (id) => document.getElementById(id);

        const elReceta = $("receta");
        const elBtn = $("btnEjecutar");
        const elEstadoApi = $("estadoApi");
        const elLedEstado = $("ledEstado");
        const elRobotPanel = $("robotPanel");
        const elMetricTokens = $("metricTokens");
        const elMetricErrores = $("metricErrores");

        const elBtnInspector = $("btnInspector");
        const elModal = $("modal");
        const elModalBackdrop = $("modalBackdrop");
        const elBtnCerrarModal = $("btnCerrarModal");
        const elTokensTbody = $("tokensTbody");
        const elListaSolidos = $("listaSolidos");
        const elListaLiquidos = $("listaLiquidos");
        const elJsonRaw = $("jsonRaw");
        const elBtnCopiarJson = $("btnCopiarJson");
        const elCodigoIntermedio = $("codigoIntermedio");

        let lastResponse = null;

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function setLed(color) {
            elLedEstado.classList.remove("bg-blue-500", "bg-green-500", "bg-red-500");
            elLedEstado.classList.remove("shadow-blue-500/30", "shadow-green-500/30", "shadow-red-500/30");
            if (color === "green") {
                elLedEstado.classList.add("bg-green-500", "shadow-green-500/30");
                return;
            }
            if (color === "red") {
                elLedEstado.classList.add("bg-red-500", "shadow-red-500/30");
                return;
            }
            elLedEstado.classList.add("bg-blue-500", "shadow-blue-500/30");
        }

        function openModal() {
            elModal.classList.remove("hidden");
            elModal.classList.add("flex");
            elModalBackdrop.classList.remove("hidden");
        }

        function closeModal() {
            elModal.classList.add("hidden");
            elModal.classList.remove("flex");
            elModalBackdrop.classList.add("hidden");
        }

        function setTab(tabName) {
            document.querySelectorAll(".tabPane").forEach((el) => el.classList.add("hidden"));
            $("tab_" + tabName).classList.remove("hidden");

            document.querySelectorAll(".tabBtn").forEach((btn) => {
                const active = btn.dataset.tab === tabName;
                btn.classList.toggle("bg-indigo-600", active);
                btn.classList.toggle("text-white", active);
                btn.classList.toggle("bg-slate-950", !active);
                btn.classList.toggle("text-slate-200", !active);
                btn.classList.toggle("hover:bg-slate-900", !active);
            });
        }

        function renderSimbolos() {
            const solidos = [];
            const liquidos = [];
            for (const [ing, tipo] of Object.entries(TIPOS_INGREDIENTES)) {
                if (tipo === "solido") solidos.push(ing);
                if (tipo === "liquido") liquidos.push(ing);
            }
            solidos.sort();
            liquidos.sort();

            elListaSolidos.innerHTML = solidos
                .map(
                    (x) =>
                        `<li class="flex items-center justify-between rounded-lg border border-slate-800 bg-slate-950/50 px-3 py-2"><span>${escapeHtml(
                            x
                        )}</span><span class="text-xs text-slate-500">solido</span></li>`
                )
                .join("");

            elListaLiquidos.innerHTML = liquidos
                .map(
                    (x) =>
                        `<li class="flex items-center justify-between rounded-lg border border-slate-800 bg-slate-950/50 px-3 py-2"><span>${escapeHtml(
                            x
                        )}</span><span class="text-xs text-slate-500">liquido</span></li>`
                )
                .join("");
        }

        function renderTokens(tokens) {
            elTokensTbody.innerHTML = tokens
                .map((t) => {
                    const token = escapeHtml(t.token);
                    const lexema = escapeHtml(t.lexema);
                    const linea = escapeHtml(t.linea);
                    return `<tr class="text-slate-200">
              <td class="px-4 py-3 font-mono">${token}</td>
              <td class="px-4 py-3 font-mono text-slate-300">${lexema}</td>
              <td class="px-4 py-3 font-mono">${linea}</td>
            </tr>`;
                })
                .join("");
        }

        function formatErrorBlocks(resp) {
            const bloques = [];

            const lex = Array.isArray(resp?.errores_lexicos) ? resp.errores_lexicos : [];
            const sint = Array.isArray(resp?.errores_sintacticos) ? resp.errores_sintacticos : [];
            const sem = Array.isArray(resp?.errores_semanticos) ? resp.errores_semanticos : [];

            for (const e of lex) {
                const msg = `Error léxico: '${e.lexema}' (línea ${e.linea}, col ${e.columna})`;
                bloques.push(msg);
            }

            for (const e of sint) {
                const base = e.mensaje ?? "Error sintáctico";
                const loc =
                    e.linea != null && e.columna != null ? ` (línea ${e.linea}, col ${e.columna})` : "";
                bloques.push(`${base}${loc}`);
            }

            for (const e of sem) {
                const base = e.mensaje ?? "Error semántico";
                const loc =
                    e.linea != null && e.columna != null ? ` (línea ${e.linea}, col ${e.columna})` : "";
                bloques.push(`${base}${loc}`);
            }

            return bloques;
        }

        function renderRobotConsole(resp) {
            const errores = formatErrorBlocks(resp);
            const lexCount = Array.isArray(resp?.errores_lexicos) ? resp.errores_lexicos.length : 0;
            const sintCount = Array.isArray(resp?.errores_sintacticos) ? resp.errores_sintacticos.length : 0;
            const semCount = Array.isArray(resp?.errores_semanticos) ? resp.errores_semanticos.length : 0;
            const tokensCount = Array.isArray(resp?.tokens) ? resp.tokens.length : 0;

            elMetricTokens.textContent = String(tokensCount);
            elMetricErrores.textContent = String(errores.length);

            if (errores.length === 0 && resp?.sintaxis_correcta === true) {
                elRobotPanel.innerHTML = `
            <div class="rounded-xl border border-emerald-900/60 bg-emerald-950/40 px-4 py-4 transition-all duration-300">
              <div class="text-sm font-semibold text-emerald-300">¡Receta lista para cocinar! 👨‍🍳</div>
              <div class="mt-2 text-xs text-emerald-200/70">
                Tokens: ${tokensCount} · Sintaxis: OK · Semántica: OK
              </div>
            </div>
          `;
                return;
            }

            const items = errores
                .slice(0, 8)
                .map((e) => `<li class="font-mono text-xs text-red-200">${escapeHtml(e)}</li>`)
                .join("");

            const extra = errores.length > 8 ? `<div class="mt-3 text-xs text-red-200/70">+${errores.length - 8} más… revisa el Panel de Inspección</div>` : "";

            if (semCount > 0 && lexCount === 0 && sintCount === 0 && resp?.sintaxis_correcta === true) {
                elRobotPanel.innerHTML = `
            <div class="rounded-xl border border-red-900/40 bg-red-900/20 px-4 py-4 transition-all duration-300">
              <div class="text-sm font-semibold text-red-300">Se detectaron errores semánticos</div>
              <ul class="mt-3 space-y-2">${items}</ul>
              ${extra}
            </div>
          `;
                return;
            }

            elRobotPanel.innerHTML = `
          <div class="rounded-xl border border-red-900/60 bg-red-950/40 px-4 py-4 transition-all duration-300">
            <div class="text-sm font-semibold text-red-300">Se detectaron errores</div>
            <ul class="mt-3 space-y-2">${items}</ul>
            ${extra}
          </div>
        `;
        }

        function renderJson(resp) {
            elJsonRaw.textContent = JSON.stringify(resp ?? {}, null, 2);
        }

        function renderCodigoIntermedio(lines) {
            const arr = Array.isArray(lines) ? lines : [];
            elCodigoIntermedio.textContent = arr.join("\n");
        }

        async function postCompilar(receta) {
            let lastError = null;
            for (const url of API_URLS) {
                try {
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ receta }),
                    });
                    const data = await res.json();
                    return { url, res, data };
                } catch (e) {
                    lastError = e;
                }
            }
            throw lastError ?? new Error("No se pudo conectar con la API");
        }

        async function ejecutar() {
            const receta = elReceta.value ?? "";
            elEstadoApi.textContent = "ejecutando";
            setLed("blue");
            elBtn.disabled = true;
            elBtn.classList.add("opacity-70");

            try {
                const { url, res, data } = await postCompilar(receta);
                lastResponse = data;

                renderRobotConsole(data);
                renderTokens(Array.isArray(data?.tokens) ? data.tokens : []);
                renderJson(data);
                renderCodigoIntermedio(data?.codigo_intermedio);
                let originLabel = "api";
                if (url.startsWith("/")) originLabel = "local";
                else if (url.includes(":8001")) originLabel = "8001";
                else if (url.includes(":8000")) originLabel = "8000";
                elEstadoApi.textContent = res.ok ? `ok:${originLabel}` : `http ${res.status}:${originLabel}`;
                const hasErrors =
                    (Array.isArray(data?.errores_lexicos) && data.errores_lexicos.length > 0) ||
                    (Array.isArray(data?.errores_sintacticos) && data.errores_sintacticos.length > 0) ||
                    (Array.isArray(data?.errores_semanticos) && data.errores_semanticos.length > 0) ||
                    data?.sintaxis_correcta !== true;
                setLed(res.ok && !hasErrors ? "green" : "red");
            } catch (e) {
                const msg = e?.message ? String(e.message) : "Error de red";
                elEstadoApi.textContent = "error";
                setLed("red");
                renderRobotConsole({
                    tokens: [],
                    errores_lexicos: [],
                    sintaxis_correcta: false,
                    errores_sintacticos: [{ mensaje: "No se pudo conectar con la API: " + msg, linea: null, columna: null }],
                    errores_semanticos: [],
                });
                renderTokens([]);
                renderJson({ error: msg });
                renderCodigoIntermedio([]);
            } finally {
                elBtn.disabled = false;
                elBtn.classList.remove("opacity-70");
            }
        }

        elBtn.addEventListener("click", ejecutar);
        elReceta.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) {
                ev.preventDefault();
                ejecutar();
            }
        });

        elBtnInspector.addEventListener("click", () => {
            openModal();
            setTab("tokens");
        });
        elBtnCerrarModal.addEventListener("click", closeModal);
        elModalBackdrop.addEventListener("click", closeModal);

        document.addEventListener("keydown", (ev) => {
            if (ev.key === "Escape") closeModal();
        });

        document.querySelectorAll(".tabBtn").forEach((btn) => {
            btn.addEventListener("click", () => setTab(btn.dataset.tab));
        });

        elBtnCopiarJson.addEventListener("click", async () => {
            const text = elJsonRaw.textContent ?? "";
            try {
                await navigator.clipboard.writeText(text);
                elBtnCopiarJson.textContent = "Copiado";
                setTimeout(() => (elBtnCopiarJson.textContent = "Copiar"), 900);
            } catch {
                elBtnCopiarJson.textContent = "No disponible";
                setTimeout(() => (elBtnCopiarJson.textContent = "Copiar"), 900);
            }
        });

        renderSimbolos();
        setTab("tokens");
        renderTokens([]);
        renderJson({});
        renderCodigoIntermedio([]);
    </script>
</body>

</html> -->
